name: Build and draft UMEDJON 19.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure APK inspection tools are available
        run: |
          set -euo pipefail
          if test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"; then
            echo "Preinstalled Android build-tools 35.0.0 found."
          else
            SDK_MANAGER="$(command -v sdkmanager || true)"
            if test -z "$SDK_MANAGER"; then
              SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
            fi
            test -n "$SDK_MANAGER"
            "$SDK_MANAGER" 'build-tools;35.0.0'
          fi
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Restore complete sources from versioned repository chunks
        run: |
          set -euo pipefail
          test -d sources/v19.5
          test -f sources/v19.5/SHA256SUMS
          (cd sources/v19.5 && sha256sum -c SHA256SUMS)
          cat sources/v19.5/source.part-* > "$RUNNER_TEMP/File-Manager-UMEDJON-19.5-Source.zip"
          unzip -tq "$RUNNER_TEMP/File-Manager-UMEDJON-19.5-Source.zip"
          unzip -q "$RUNNER_TEMP/File-Manager-UMEDJON-19.5-Source.zip" -d "$RUNNER_TEMP/project"
          test -f "$RUNNER_TEMP/project/UMEDJON-Source/scripts/build.py"
          test ! -e "$RUNNER_TEMP/project/UMEDJON-Source/keys/signing.json"
          test ! -e "$RUNNER_TEMP/project/UMEDJON-Source/keys/umedjon.jks"

      - name: Run release checks from restored sources
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/project/UMEDJON-Source"
          python3 -m unittest discover -s tests/release195 -p check.py -v

      - name: Restore the original signing key from Secrets
        env:
          UMEDJON_KEYSTORE_BASE64: ${{ secrets.UMEDJON_KEYSTORE_BASE64 }}
          UMEDJON_STORE_PASS: ${{ secrets.UMEDJON_STORE_PASS }}
          UMEDJON_KEY_PASS: ${{ secrets.UMEDJON_KEY_PASS }}
          UMEDJON_KEY_ALIAS: ${{ secrets.UMEDJON_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${UMEDJON_KEYSTORE_BASE64}" && test -n "${UMEDJON_STORE_PASS}" && test -n "${UMEDJON_KEY_PASS}" && test -n "${UMEDJON_KEY_ALIAS}"
          printf '%s' "${UMEDJON_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/umedjon-original.jks"
          chmod 600 "$RUNNER_TEMP/umedjon-original.jks"

      - name: Build and sign source APK
        env:
          UMEDJON_STORE_PASS: ${{ secrets.UMEDJON_STORE_PASS }}
          UMEDJON_KEY_PASS: ${{ secrets.UMEDJON_KEY_PASS }}
          UMEDJON_KEY_ALIAS: ${{ secrets.UMEDJON_KEY_ALIAS }}
          UMEDJON_KEYSTORE_PATH: ${{ runner.temp }}/umedjon-original.jks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/project/UMEDJON-Source"
          python3 scripts/build.py
          test -s output/File-Manager-UMEDJON-19.5.apk

      - name: Verify package, version, signer and SHA-256
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/project/UMEDJON-Source/output/File-Manager-UMEDJON-19.5.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          python3 - <<'PY'
          import pathlib,re,os
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'badging.txt').read_text()
          match=re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",text,re.M)
          assert match, 'Unable to read APK package identity'
          assert match.groups()==('com.umedjon.filemanager','2103106','19.5'),match.groups()
          PY
          java -jar "$RUNNER_TEMP/project/UMEDJON-Source/toolchain/sdk/android-15/lib/apksigner.jar" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: File-Manager-UMEDJON-19.5-signed
          path: ${{ runner.temp }}/project/UMEDJON-Source/output/File-Manager-UMEDJON-19.5.apk
          if-no-files-found: error

      - name: Create an unpublished draft automatically with built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v19.5
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/project/UMEDJON-Source/output/File-Manager-UMEDJON-19.5.apk"
          SOURCE="$RUNNER_TEMP/File-Manager-UMEDJON-19.5-Source.zip"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          tag=os.environ['RELEASE_TAG'];repo=os.environ['GITHUB_REPOSITORY']
          apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'project/UMEDJON-Source/output/File-Manager-UMEDJON-19.5.apk'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'update.json'
          data={'versionName':'19.5','versionCode':2103106,
                'apkUrl':f'https://github.com/{repo}/releases/download/{tag}/{apk.name}',
                'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
                'notes':'PDF: описания новых страниц, порядок чтения, встроенное сохранение и всплывающий прогресс.',
                'releaseUrl':f'https://github.com/{repo}/releases/tag/{tag}'}
          out.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          # Drafts created in the web UI may be addressable by release ID
          # before the eventual Git tag exists; do not use /releases/tags here.
          RELEASES_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          DRAFT_ID="$(printf '%s' "$RELEASES_JSON" | jq -r --arg tag "$RELEASE_TAG" '[.[] | select(.draft == true and .tag_name == $tag) | .id][0] // empty')"
          if test -n "$DRAFT_ID"; then
            echo "Existing draft detected by release ID; preserving user-tested assets."
          else
            echo "No existing draft found; creating one from the main branch."
            gh release create "$RELEASE_TAG" "$APK" "$SOURCE" "$RUNNER_TEMP/update.json" \
              --repo "$GITHUB_REPOSITORY" --draft --target main \
              --title 'Файловый менеджер UMEDJON 19.5 — тестовая сборка' \
              --notes 'Новые страницы PDF с описаниями; улучшение порядка скринридера; встроенное сохранение PDF; всплывающий прогресс. Требуется проверка на устройстве.'
            RELEASES_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
            DRAFT_ID="$(printf '%s' "$RELEASES_JSON" | jq -r --arg tag "$RELEASE_TAG" '[.[] | select(.draft == true and .tag_name == $tag) | .id][0] // empty')"
          fi
          test -n "$DRAFT_ID"
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}")"
          printf '%s' "$RELEASE_JSON" | jq -e '.draft == true'
          for asset in "$APK" "$SOURCE" "$RUNNER_TEMP/update.json"; do
            asset_name="$(basename "$asset")"
            printf '%s' "$RELEASE_JSON" | jq -e --arg name "$asset_name" '[.assets[].name] | index($name) != null'
          done
          printf '%s' "$RELEASE_JSON" | jq '{draft, tag_name, html_url, assets: [.assets[].name]}'
