name: Build and draft UMEDJON 19.6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install APK inspection tools
        run: sdkmanager 'build-tools;35.0.0'

      - name: Restore verified 19.5 sources and apply the 19.6 fix
        run: |
          set -euo pipefail
          test -d sources/v19.5
          test -f sources/v19.5/SHA256SUMS
          test -f patches/v19.6.patch
          (cd sources/v19.5 && sha256sum -c SHA256SUMS)
          cat sources/v19.5/source.part-* > "$RUNNER_TEMP/File-Manager-UMEDJON-19.5-Source.zip"
          unzip -tq "$RUNNER_TEMP/File-Manager-UMEDJON-19.5-Source.zip"
          unzip -q "$RUNNER_TEMP/File-Manager-UMEDJON-19.5-Source.zip" -d "$RUNNER_TEMP/project"
          test -f "$RUNNER_TEMP/project/UMEDJON-Source/scripts/build.py"
          (cd "$RUNNER_TEMP/project/UMEDJON-Source" && patch --batch --forward -p1 < "$GITHUB_WORKSPACE/patches/v19.6.patch")
          test ! -e "$RUNNER_TEMP/project/UMEDJON-Source/keys/signing.json"
          test ! -e "$RUNNER_TEMP/project/UMEDJON-Source/keys/umedjon.jks"

      - name: Run release checks from restored sources
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/project/UMEDJON-Source"
          python3 -m unittest discover -s tests/release195 -p check.py -v
          python3 -m unittest discover -s tests/release196 -p check.py -v

      - name: Restore the original signing key from Secrets
        env:
          UMEDJON_KEYSTORE_BASE64: ${{ secrets.UMEDJON_KEYSTORE_BASE64 }}
          UMEDJON_STORE_PASS: ${{ secrets.UMEDJON_STORE_PASS }}
          UMEDJON_KEY_PASS: ${{ secrets.UMEDJON_KEY_PASS }}
          UMEDJON_KEY_ALIAS: ${{ secrets.UMEDJON_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${UMEDJON_KEYSTORE_BASE64}" && test -n "${UMEDJON_STORE_PASS}" && test -n "${UMEDJON_KEY_PASS}" && test -n "${UMEDJON_KEY_ALIAS}"
          printf '%s' "${UMEDJON_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/umedjon-original.jks"
          chmod 600 "$RUNNER_TEMP/umedjon-original.jks"

      - name: Build and sign source APK
        env:
          UMEDJON_STORE_PASS: ${{ secrets.UMEDJON_STORE_PASS }}
          UMEDJON_KEY_PASS: ${{ secrets.UMEDJON_KEY_PASS }}
          UMEDJON_KEY_ALIAS: ${{ secrets.UMEDJON_KEY_ALIAS }}
          UMEDJON_KEYSTORE_PATH: ${{ runner.temp }}/umedjon-original.jks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/project/UMEDJON-Source"
          python3 scripts/build.py
          test -s output/File-Manager-UMEDJON-19.6.apk

      - name: Verify package, version, signer and SHA-256
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/project/UMEDJON-Source/output/File-Manager-UMEDJON-19.6.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          python3 - <<'PY'
          import pathlib,re,os
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'badging.txt').read_text()
          match=re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",text,re.M)
          assert match, 'Unable to read APK package identity'
          assert match.groups()==('com.umedjon.filemanager','2103107','19.6'),match.groups()
          PY
          java -jar "$RUNNER_TEMP/project/UMEDJON-Source/toolchain/sdk/android-15/lib/apksigner.jar" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: File-Manager-UMEDJON-19.6-signed
          path: ${{ runner.temp }}/project/UMEDJON-Source/output/File-Manager-UMEDJON-19.6.apk
          if-no-files-found: error

      - name: Package complete public 19.6 sources without private keys
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/project/UMEDJON-Source"
          python3 scripts/package-release195.py --public-only
          SOURCE="$RUNNER_TEMP/deliverables/File-Manager-UMEDJON-19.6-Source.zip"
          unzip -tq "$SOURCE"
          if unzip -Z -1 "$SOURCE" | grep -E '^UMEDJON-Source/keys/'; then
            echo 'Signing material detected in public ZIP' >&2
            exit 1
          fi

      - name: Create an unpublished draft automatically with built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v19.6
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/project/UMEDJON-Source/output/File-Manager-UMEDJON-19.6.apk"
          SOURCE="$RUNNER_TEMP/deliverables/File-Manager-UMEDJON-19.6-Source.zip"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          tag=os.environ['RELEASE_TAG'];repo=os.environ['GITHUB_REPOSITORY']
          apk=pathlib.Path(os.environ['RUNNER_TEMP'])/'project/UMEDJON-Source/output/File-Manager-UMEDJON-19.6.apk'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'update.json'
          data={'versionName':'19.6','versionCode':2103107,
                'apkUrl':f'https://github.com/{repo}/releases/download/{tag}/{apk.name}',
                'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
                'notes':'Исправлен возврат после открытия созданного PDF: окно завершения больше не появляется повторно.',
                'releaseUrl':f'https://github.com/{repo}/releases/tag/{tag}'}
          out.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" "$APK" "$SOURCE" "$RUNNER_TEMP/update.json" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" "$SOURCE" "$RUNNER_TEMP/update.json" \
              --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title 'Файловый менеджер UMEDJON — версия 19.6' \
              --notes 'Исправлен возврат после открытия созданного PDF: окно завершения больше не появляется повторно.'
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft')" = true
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,isDraft,assets,url \
            --jq '{isDraft: .isDraft, url: .url, assets: [.assets[].name]}'
